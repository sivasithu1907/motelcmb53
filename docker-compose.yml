version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: motelcmb53_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motelcmb53}
      POSTGRES_USER: ${POSTGRES_USER:-motelcmb53}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motelcmb53}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: motelcmb53_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-motelcmb53}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-motelcmb53}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      UPLOAD_DIRECTORY: /app/uploads/documents
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      TZ: Asia/Colombo
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_URL: ""
    container_name: motelcmb53_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

  proxy:
    image: caddy:2-alpine
    container_name: motelcmb53_proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}

volumes:
  postgres_data:
    name: motelcmb53_pgdata
  uploads_data:
    name: motelcmb53_uploads
  caddy_data:
    name: motelcmb53_caddy_data
  caddy_config:
    name: motelcmb53_caddy_config
